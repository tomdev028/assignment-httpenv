---
# template source: https://github.com/bretfisher/docker-build-workflow/blob/main/templates/call-docker-build.yaml
name: Docker Build

on:
  push:
    branches:
      - main
    # don't rebuild image if someone only edited unrelated files
    paths-ignore:
      - 'README.md'
      - '.github/linters/**'
  pull_request:
    # don't rebuild image if someone only edited unrelated files
    paths-ignore:
      - 'README.md'
      - '.github/linters/**'
  schedule:
    # re-run montly to keep image fresh with upstream base images
    - cron: '0 12 15 * *'
  workflow_dispatch:
    # run manually from Actions tab


jobs:
  build-image:
    name: Build Image
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{secrets.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and export docker in locally
        uses: docker/build-push-action@v6
        with:
          push: false
          load: true
          tags: ${{github.run_id}}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Run Trivy for all CVEs 
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{github.run_id}}
          exit-code: 0
          format: table

      - name: Run Trivy for HIGH, CRITICAL CVEs and report(blocking)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{github.run_id}}
          exit-code: 1
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH, CRITICAL'
          format: "sarif"
          output: 'trivy-results.sarif'

      - name: Unit Testing in Docker
        run: |
          docker run --rm ${{github.run_id}} echo "Unit Testing in Docker"


      - name: Extract Docker metadata
        id: extract_meta_data
        uses: docker/metadata-action@v5
        with:
          images: devtom028/go-httpenv
          flavor: |
            latest=false
          tags: |
            type=raw,value=04
            type=raw,value=latest,enable=${{endsWith(github.ref,github.event.repository.default_branch)}}
            type=ref,event=pr
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Docker final build and push
        uses: docker/build-push-action@v6
        with:
          push: ${{github.event_name != 'pull_request'}}
          tags: ${{steps.extract_meta_data.outputs.tags}}
          labels: ${{steps.extract_meta_data.outputs.labels}}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64,linux/arm/v7

      - name: Find comment for image tags
        uses: peter-evans/find-comment@v4
        if: github.event_name == 'pull_request'
        id: fc
        with:
          issue-number: ${{github.event.pull_request.number}}
          comment-author: 'github-actions[bot]'
          body-includes: Docker image tag(s) pushed 

      - name: Create or update comment for image tags
        uses: peter-evans/create-or-update-comment@v5
        if: github.event_name == 'pull_request'
        with:
          comment-id: ${{steps.fc.outputs.comment-id}}
          issue-number: ${{github.event.pull_request.number}}
          body: |
            Docker image tag(s) pushed:
            ```text
            ${{ steps.docker_meta.outputs.tags }}
            ```

            Labels added to images:
            ```text
            ${{ steps.docker_meta.outputs.labels }}
            ```
          edit-mode: replace